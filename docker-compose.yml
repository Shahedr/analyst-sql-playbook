services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: analyst
      POSTGRES_PASSWORD: analyst
      POSTGRES_DB: sql_playbook
    ports:
      - "5433:5432"
    volumes:
      - ./:/workspace
      - sql_playbook_data:/var/lib/postgresql/data
    working_dir: /workspace
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U analyst -d sql_playbook"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  sql_playbook_data:
